name: Verify AccessLease
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: accesslease
          POSTGRES_PASSWORD: integration-only
          POSTGRES_DB: accesslease
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U accesslease" --health-interval 5s --health-timeout 3s --health-retries 12
    env:
      DATABASE_URL: postgresql://accesslease:integration-only@127.0.0.1:5432/accesslease
      APP_MODE: demo
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run check
      - run: docker build -t accesslease:ci .
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: |
            playwright-report
            artifacts/screenshots
  windows-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npx vitest run tests/permissions.test.ts
      - run: npm run build
