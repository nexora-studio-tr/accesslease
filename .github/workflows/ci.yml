name: Verify AccessLease
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: accesslease
          POSTGRES_PASSWORD: integration-only
          POSTGRES_DB: accesslease
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U accesslease" --health-interval 5s --health-timeout 3s --health-retries 12
    env:
      DATABASE_URL: postgresql://accesslease:integration-only@127.0.0.1:5432/accesslease
      APP_MODE: demo
      NODE_ENV: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run check
      - name: Build and smoke-test the container stack
        env:
          POSTGRES_PASSWORD: ci-disposable-admin-only
          APP_DB_PASSWORD: ci-disposable-app-only
          PUBLIC_ORIGIN: http://127.0.0.1:4348
        run: |
          set -euo pipefail
          trap 'docker compose down --volumes --remove-orphans' EXIT
          docker compose up --build --wait --wait-timeout 180
          node scripts/smoke.mjs
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: browser-evidence
          path: |
            playwright-report
            artifacts/screenshots
  windows-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npx vitest run tests/permissions.test.ts
      - run: npm run build
