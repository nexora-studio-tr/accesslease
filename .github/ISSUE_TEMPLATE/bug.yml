name: Bug report / Hata bildirimi
description: Report a reproducible problem without private data.
body:
  - type: textarea
    id: problem
    attributes:
      label: Expected and actual behavior / Beklenen ve gerçekleşen
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps / Tekrar adımları
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Version, OS, demo or live / Sürüm, işletim sistemi, mod
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy / Gizlilik
      options:
        - label: I removed tokens, cookies, database URLs and private server/member data.
          required: true
